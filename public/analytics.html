<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex - Analytics & Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0f1a;
            --card-bg: rgba(30, 41, 59, 0.5);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --secondary: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 5% 10%, rgba(59, 130, 246, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 95% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 30%);
            padding-bottom: 4rem;
        }

        .navbar {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 26, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Top Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }

        .stat-footer {
            font-size: 0.85rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Main Content Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Charts */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* Form Controls */
        .metric-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Progress Circle */
        .progress-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .circle-svg {
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: var(--glass-border);
            stroke-width: 8;
        }

        .circle-progress {
            fill: none;
            stroke: var(--primary);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 251;
            stroke-dashoffset: 251;
            transition: stroke-dashoffset 1s ease-out;
        }

        .progress-text {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/dashboard.html" class="logo">FLEX</a>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <a href="/exercises.html" style="color: var(--text-dim); text-decoration: none; font-size: 0.9rem;">Exercise
                Library</a>
            <a href="/dashboard.html" class="btn">Dashboard</a>
        </div>
    </nav>

    <div class="container" id="loadingState">
        <h2 style="text-align: center; margin-top: 4rem; color: var(--text-dim);">Analyzing your performance...</h2>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <div class="summary-grid">
            <div class="stat-card">
                <span class="stat-label">Current Streak</span>
                <span class="stat-value" id="streakValue">0 Days</span>
                <div class="stat-footer">🔥 Keep it up!</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Weekly Volume</span>
                <span class="stat-value" id="volumeValue">0 kg</span>
                <div class="stat-footer">💪 Total Tonnage</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Goal Progress</span>
                <span class="stat-value" id="progressValue">0%</span>
                <div class="stat-footer" id="remainingText">0 sessions left</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Plan Completion</span>
                <div class="progress-container" style="position: relative;">
                    <svg width="100" height="100" class="circle-svg">
                        <circle cx="50" cy="50" r="40" class="circle-bg"></circle>
                        <circle cx="50" cy="50" r="40" class="circle-progress" id="progressCircle"></circle>
                    </svg>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="glass-panel">
                <div class="panel-header">
                    <span class="panel-title">Body Weight Progress</span>
                </div>
                <div class="chart-container">
                    <canvas id="bodyChart"></canvas>
                </div>
            </div>

            <div class="glass-panel">
                <div class="panel-header">
                    <span class="panel-title">Muscle Focus</span>
                </div>
                <div class="chart-container">
                    <canvas id="muscleChart"></canvas>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="glass-panel">
                <span class="panel-title">Log Today's Metrics</span>
                <form id="metricsForm" class="metric-form">
                    <div>
                        <label class="stat-label">Weight (kg)</label>
                        <input type="number" step="0.1" id="weightInput" placeholder="75.0">
                    </div>
                    <div>
                        <label class="stat-label">Fat % (Optional)</label>
                        <input type="number" step="0.1" id="fatInput" placeholder="15.0">
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <button type="submit" class="btn" style="width: 100%;">Record Measurement</button>
                    </div>
                </form>
            </div>

            <div class="glass-panel">
                <span class="panel-title">Active Hours</span>
                <div style="margin-top: 1rem; display: flex; align-items: baseline; gap: 0.5rem;">
                    <span style="font-size: 2.5rem; font-weight: 700;">12.5</span>
                    <span style="color: var(--text-dim);">Hours this month</span>
                </div>
                <div
                    style="margin-top: 1rem; width: 100%; height: 8px; background: rgba(0,0,0,0.2); border-radius: 4px;">
                    <div style="width: 65%; height: 100%; background: var(--secondary); border-radius: 4px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('accessToken');
        if (!token) window.location.href = '/login.html';

        let bodyChart, muscleChart;

        async function init() {
            try {
                await Promise.all([
                    fetchSummary(),
                    fetchMuscles(),
                    fetchMetrics()
                ]);

                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } catch (err) {
                console.error('Initialization failed', err);
            }
        }

        async function fetchSummary() {
            const res = await fetch('/api/analytics/summary', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const json = await res.json();
            const summary = json.data.summary;


            document.getElementById('streakValue').innerText = `${summary.currentStreak} Days`;
            document.getElementById('volumeValue').innerText = `${summary.weeklyTonnage.toLocaleString()} kg`;
            document.getElementById('progressValue').innerText = `${summary.progressPercent}%`;
            document.getElementById('remainingText').innerText = `${summary.remainingCount} sessions left`;

            // Circular progress
            const circle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 40;
            const offset = circumference - (summary.progressPercent / 100) * circumference;
            circle.style.strokeDashoffset = offset;
            document.getElementById('progressText').innerText = `${summary.progressPercent}%`;
        }

        async function fetchMuscles() {
            const res = await fetch('/api/analytics/muscles', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const json = await res.json();
            const distribution = json.data.distribution;


            const labels = Object.keys(distribution);
            const values = Object.values(distribution);

            const ctx = document.getElementById('muscleChart').getContext('2d');
            muscleChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Volume (kg)',
                        data: values,
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        pointBackgroundColor: '#3b82f6'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        async function fetchMetrics() {
            const res = await fetch('/api/analytics/metrics', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const json = await res.json();
            const metrics = json.data.metrics;


            const labels = metrics.map(m => new Date(m.date).toLocaleDateString());
            const weights = metrics.map(m => m.weight);

            const ctx = document.getElementById('bodyChart').getContext('2d');
            bodyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Weight (kg)',
                        data: weights,
                        borderColor: '#10b981',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(16, 185, 129, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        document.getElementById('metricsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const weight = document.getElementById('weightInput').value;
            const fat = document.getElementById('fatInput').value;

            const res = await fetch('/api/analytics/metrics', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ weight, fatPercentage: fat })
            });

            if (res.ok) {
                alert('Stat recorded!');
                location.reload();
            }
        });

        init();
    </script>
</body>

</html>
