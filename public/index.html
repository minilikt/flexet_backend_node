<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex - Better Workout Planning</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0a0a0a;
            --text: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 0;
            background: linear-gradient(to right, #00ff88, #66ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #888;
            font-size: 1.2rem;
            margin-top: 1rem;
            max-width: 500px;
        }

        .cta {
            margin-top: 2.5rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 700;
            margin: 0 0.5rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: black;
        }

        .btn-outline {
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <h1>Flex</h1>
    <p>The ultimate engine for generating personalized, progressive workout plans with data-driven precision.</p>
    <div class="cta">
        <a href="/login.html" class="btn btn-outline">Login</a>
        <a href="/register.html" class="btn btn-primary">Start Training</a>
    </div>
</body>

</html>
