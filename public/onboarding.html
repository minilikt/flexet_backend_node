<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex - Onboarding</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: var(--primary);
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #475569;
            color: white;
            margin-top: 0.5rem;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .checkbox-option {
            background: #334155;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-option.selected {
            background: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Setup Profile</h1>
        <form id="onboardingForm">

            <!-- Step 1: Biometrics -->
            <div class="step active" id="step1">
                <h3>Basic Info</h3>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" name="height" placeholder="175" required>
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" name="weight" placeholder="70" required>
                </div>
                <button type="button" class="btn-primary" onclick="nextStep(2)">Next</button>
            </div>

            <!-- Step 2: Goals & Experience -->
            <div class="step" id="step2">
                <h3>Goals & Experience</h3>
                <div class="form-group">
                    <label>Primary Goal</label>
                    <select name="goal">
                        <option value="hypertrophy">Hypertrophy (Build Muscle)</option>
                        <option value="strength">Strength (Get Stronger)</option>
                        <option value="endurance">Endurance (Stamina/Tone)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Training Level</label>
                    <select name="trainingLevel">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Workout Days</label>
                    <div class="checkbox-group" id="daysGroup">
                        <div class="checkbox-option" onclick="toggleSelection(this, 'workoutDays', 'Monday')">Mon</div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'workoutDays', 'Tuesday')">Tue</div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'workoutDays', 'Wednesday')">Wed
                        </div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'workoutDays', 'Thursday')">Thu
                        </div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'workoutDays', 'Friday')">Fri</div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'workoutDays', 'Saturday')">Sat
                        </div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'workoutDays', 'Sunday')">Sun</div>
                    </div>
                    <input type="hidden" name="workoutDays" id="workoutDaysInput">
                </div>
                <button type="button" class="btn-primary" onclick="nextStep(3)">Next</button>
                <button type="button" class="btn-secondary" onclick="nextStep(1)">Back</button>
            </div>

            <!-- Step 3: Lifestyle & Preferences -->
            <div class="step" id="step3">
                <h3>Lifestyle</h3>
                <div class="form-group">
                    <label>Daily Sleep (Hours)</label>
                    <input type="number" name="sleepHours" step="0.5" placeholder="7.5">
                </div>
                <div class="form-group">
                    <label>Water Intake (Liters)</label>
                    <input type="number" name="waterIntake" step="0.1" placeholder="2.5">
                </div>
                <div class="form-group">
                    <label>Available Equipment</label>
                    <div class="checkbox-group" id="equipmentGroup">
                        <div class="checkbox-option" onclick="toggleSelection(this, 'equipment', 'gym')">Gym Access
                        </div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'equipment', 'dumbbells')">Dumbbells
                        </div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'equipment', 'barbell')">Barbell
                        </div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'equipment', 'bands')">Resistance
                            Bands</div>
                        <div class="checkbox-option" onclick="toggleSelection(this, 'equipment', 'bodyweight')">
                            Bodyweight Only</div>
                    </div>
                    <input type="hidden" name="equipment" id="equipmentInput">
                </div>
                <button type="submit" class="btn-primary">Complete Setup</button>
                <button type="button" class="btn-secondary" onclick="nextStep(2)">Back</button>
            </div>

        </form>
    </div>

    <script>
        let currentStep = 1;
        const formData = {
            equipment: [],
            workoutDays: []
        };

        function nextStep(step) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            currentStep = step;
        }

        function toggleSelection(el, category, value) {
            el.classList.toggle('selected');
            if (!formData[category]) formData[category] = [];

            const index = formData[category].indexOf(value);
            if (index === -1) {
                formData[category].push(value);
            } else {
                formData[category].splice(index, 1);
            }
            document.getElementById(category + 'Input').value = formData[category].join(',');
        }

        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawData = new FormData(e.target);
            const data = Object.fromEntries(rawData.entries());

            // Merge array data
            data.equipment = formData.equipment;
            data.workoutDays = formData.workoutDays;

            // Numeric conversion
            ['age', 'height', 'weight', 'sleepHours', 'waterIntake'].forEach(k => {
                if (data[k]) data[k] = parseFloat(data[k]);
            });

            // Ensure at least 3 days if empty (default for generator)
            const daysPerWeek = data.workoutDays.length || 3;
            console.log('Generating plan for:', daysPerWeek, 'days');

            // Get token from local storage
            const token = localStorage.getItem('accessToken');
            if (!token) {
                alert('Please login first');
                window.location.href = '/login.html';
                return;
            }

            try {
                // 1. Save Profile
                const profileRes = await fetch('/api/users/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });

                if (!profileRes.ok) throw new Error((await profileRes.json()).message || 'Profile update failed');

                // 2. Generate Workout Plan
                // Note: backend now accepts workoutDays array directly
                const generateRes = await fetch('/api/workout/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        goal: data.goal,
                        days_per_week: daysPerWeek,
                        workoutDays: data.workoutDays, // Explicitly pass the array
                        available_equipment: data.equipment,
                        exercises_per_day: 6,
                        weeks: 4,
                        progressionModel: "LINEAR"
                    })
                });

                if (!generateRes.ok) {
                    const errorData = await generateRes.json();
                    throw new Error(errorData.message || 'Plan generation failed');
                }

                // 3. Success & Redirect
                alert('Profile saved & Workout Plan generated! Redirecting...');
                window.location.href = '/dashboard.html';

            } catch (error) {
                console.error('Onboarding Error:', error);
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>

</html>
